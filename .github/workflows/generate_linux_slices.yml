name: Generate Linux slices
# Workflow that regenerates the `swift_deps/linux` slice of child workspaces.
# A Linux slice can only be produced by Linux SwiftPM, so a maintainer on macOS
# runs this, downloads the artifact, and commits it.
#
# Dispatch (only works once this file is on the default branch):
#
#   gh workflow run generate_linux_slices.yml --ref <branch> \
#     -f dirs="examples/multi_slice" -f command=cache
#
# `command` picks the `@swift_package` target to run: `cache` (the default)
# rebuilds the slice from the committed `Package.resolved`, `resolve` resolves
# first, and `update` updates the pins. A push always uses `cache`.
#
# Push marker (works from `cgrindel/v2_*` branches before the file reaches the
# default branch). A push runs the job only when the head commit message
# contains `[linux-slices]`, and regenerates every workspace that has a
# `swift_deps/linux/inc.MODULE.bazel`:
#
#   git commit --allow-empty -m "chore: regenerate Linux slices [linux-slices]" && git push
#   gh run list --workflow generate_linux_slices.yml
#   gh run download <id> --name linux-slices
#   # At the repo root. Remove the old slice first so that identities the
#   # new slice pruned do not linger.
#   rm -rf <dir>/swift_deps/linux
#   tar -xzf linux-slices.tgz
"on":
  push:
    branches:
      - "cgrindel/v2_*"
  workflow_dispatch:
    inputs:
      dirs:
        description: >-
          Space-separated child workspace directories, relative to the repo root, whose `swift_deps/linux` slice to regenerate. Empty means every workspace with a `swift_deps/linux/inc.MODULE.bazel`.
        default: examples/multi_slice
        required: false
      command:
        description: The `@swift_package` target to run in each workspace.
        type: choice
        options:
          - cache
          - resolve
          - update
        default: cache
        required: false
permissions:
  contents: read
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linux-slices]')
    runs-on: ubuntu-22.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/set_up_ubuntu
        with:
          ubuntu_version: "22.04"
      - name: Regenerate the Linux slices
        shell: bash
        # Dispatch inputs reach the shell through `env`, never through `${{ }}`
        # interpolation, which would splice untrusted text into the script.
        # `DIRS` and `COMMAND` are empty on push; discover the workspaces and
        # use `cache` in that case.
        env:
          DIRS: ${{ inputs.dirs }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -o errexit -o nounset -o pipefail
          COMMAND="${COMMAND:-cache}"
          case "${COMMAND}" in
            cache | resolve | update) ;;
            *)
              echo >&2 "Unknown command: ${COMMAND}. Expected cache, resolve or update."
              exit 1
              ;;
          esac
          if [[ -z "${DIRS// /}" ]]; then
            DIRS="$(find . -path '*/swift_deps/linux/inc.MODULE.bazel' -not -path './bazel-*' \
              | sed 's#/swift_deps/linux/inc.MODULE.bazel##; s#^\./##' | sort | tr '\n' ' ')"
          fi
          if [[ -z "${DIRS// /}" ]]; then
            echo >&2 "No workspaces with swift_deps/linux/inc.MODULE.bazel found."
            exit 1
          fi
          read -r -a dirs <<<"${DIRS}"
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            # The Linux host selects the `linux` slice by default.
            ( cd "${dir}" && bazelisk run "@swift_package//:${COMMAND}" )
            # Drop the SwiftPM scratch dirs; they are never committed.
            rm -rf "${dir}"/swift_deps/*/.build
            echo "::endgroup::"
          done
          slice_dirs=()
          for dir in "${dirs[@]}"; do
            slice_dirs+=("${dir}/swift_deps/linux")
          done
          # Relative paths, so `tar -x` at the repo root restores them in place.
          tar -czf linux-slices.tgz "${slice_dirs[@]}"
          tar -tzf linux-slices.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-slices
          path: linux-slices.tgz
          if-no-files-found: error
          retention-days: 14
