name: Set Up macOS Runner
description: Prepare macOS runner to execute tests.
inputs:
  test_target:
    description: The test target to execute.
    default: ''
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.2'
    - name: Confirm Xcode Version
      shell: bash
      run: |
        # Print used Xcode version
        xcode-select -print-path
        xcodebuild -version
    - uses: cgrindel/gha_set_up_bazel@1d90e265a42a5a0eb50b7fb1781e7bf3154e3aed # v2.0.22
    - name: Update local.bazelrc with macOS Flags
      shell: bash
      run: |
        cat >> "local.bazelrc" <<EOF
        # The runner image has no iOS 27.2 simulator runtime for Xcode 27.2.
        build --ios_simulator_version=27.0
        # Inside Bazel actions, xcrun resolves to the Command Line Tools, whose
        # SDK is missing on the runner image. Pin the Xcode selected above.
        build --action_env=DEVELOPER_DIR=$(xcode-select -p)
        build --test_env=DEVELOPER_DIR=$(xcode-select -p)
        EOF
    # As of macos-13 runner, go was not on the PATH. This resulted in bazel run
    # //:go_update_repos failing.
    - uses: actions/setup-go@v7
      with:
        go-version: ">=1.20.0"
