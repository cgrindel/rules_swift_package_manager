name: Set Up macOS Runner
description: Prepare macOS runner to execute tests.
inputs:
  test_target:
    description: The test target to execute.
    default: ''
  xcode_version:
    description: The Xcode version to select.
    default: '27.0'
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode_version }}
    - name: Confirm Xcode Version
      shell: bash
      run: |
        # Print used Xcode version
        xcode-select -print-path
        xcodebuild -version
    - uses: cgrindel/gha_set_up_bazel@1d90e265a42a5a0eb50b7fb1781e7bf3154e3aed # v2.0.22
    # As of macos-13 runner, go was not on the PATH. This resulted in bazel run
    # //:go_update_repos failing.
    - uses: actions/setup-go@v7
      with:
        go-version: ">=1.20.0"
